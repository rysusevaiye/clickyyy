[package]
name = "clicky"
version = "1.1.0"
description = "Mechanical keyboard sounds for every keystroke"
authors = ["Heyrishi"]
license = "MIT"
repository = "https://github.com/rysusevaiye/clickyyy"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
crossbeam-channel = "0.5"
fastrand = "2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
