name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libx11-dev libxtst-dev libxi-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Clicky ${{ github.ref_name }}
          releaseBody: |
            Clicky by Heyrishi: realistic mechanical keyboard sounds as you type.

            **Downloads**
            - **macOS** (Apple Silicon + Intel): `Clicky_*_universal.dmg`
            - **Windows**: `Clicky_*_x64-setup.exe` or `Clicky_*_x64_en-US.msi`
            - **Linux**: `.AppImage`, `.deb` or `.rpm`

            See the README for first-run notes (macOS Input Monitoring, unsigned-app warnings, Linux X11).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
