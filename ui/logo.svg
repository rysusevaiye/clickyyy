<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A33"/>
      <stop offset="0.55" stop-color="#0E3A66"/>
      <stop offset="1" stop-color="#1B7FC4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BDDFB"/>
      <stop offset="1" stop-color="#2E8FD0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CDEFFF"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E4C86"/>
      <stop offset="1" stop-color="#0A2F57"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- frost sparkles -->
  <g fill="#E0F6FF">
    <path d="M190 210 l10 30 30 10 -30 10 -10 30 -10 -30 -30 -10 30 -10 z" opacity="0.85"/>
    <path d="M842 168 l7 21 21 7 -21 7 -7 21 -7 -21 -21 -7 21 -7 z" opacity="0.7"/>
    <path d="M858 820 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z" opacity="0.55"/>
  </g>

  <!-- keycap -->
  <ellipse cx="512" cy="836" rx="300" ry="34" fill="#04101F" opacity="0.45"/>
  <rect x="222" y="262" width="580" height="560" rx="128" fill="url(#skirt)"/>
  <rect x="222" y="262" width="580" height="560" rx="128" fill="none" stroke="#DFF5FF" stroke-opacity="0.5" stroke-width="6"/>
  <rect x="282" y="290" width="460" height="420" rx="92" fill="url(#top)"/>
  <path d="M310 330 q20 -30 70 -32 h120" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.9"/>

  <!-- C mark with sound waves -->
  <path d="M535.3 422 A105 105 0 1 0 535.3 578" fill="none" stroke="url(#mark)" stroke-width="56" stroke-linecap="round"/>
  <path d="M602.6 403.6 A168 168 0 0 1 602.6 596.4" fill="none" stroke="#1B7FC4" stroke-width="24" stroke-linecap="round"/>
  <path d="M649.9 384.5 A218 218 0 0 1 649.9 615.5" fill="none" stroke="#38BDF8" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
</svg>
